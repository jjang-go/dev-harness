name: 버그 리포트
description: 기대와 다르게 동작하는 문제를 보고한다.
title: "[버그] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        사람과 에이전트가 이 이슈만 보고 바로 작업할 수 있도록 구체적으로 적어 주세요.
        필수 항목은 재현 단계, 기대 동작, 수용 기준입니다. 나머지는 알고 있는 만큼만 적어도 됩니다.
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: 중복 확인
      options:
        - label: 같은 문제의 기존 이슈가 없는지 검색했다.
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 단계
      description: 번호를 붙여 순서대로 적는다. 입력값과 환경을 포함한다.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상이라면 어떻게 동작해야 하는지 구체적인 예와 함께 적는다.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로 일어난 일과 오류 메시지, 로그를 적는다.
  - type: input
    id: file-hints
    attributes:
      label: 관련 파일 경로 힌트
      description: 원인이 있을 것 같은 파일이나 함수를 안다면 적는다.
      placeholder: src/auth/token.ts, refreshToken()
  - type: textarea
    id: acceptance
    attributes:
      label: 수용 기준
      description: 이 버그가 고쳐졌다고 판단할 수 있는 확인 가능한 조건. 실행할 수 있는 테스트가 있으면 이름을 적는다.
      placeholder: |
        - [ ] 위 재현 단계를 따라 해도 문제가 나타나지 않는다.
        - [ ] 회귀를 막는 테스트가 추가된다.
    validations:
      required: true
  - type: textarea
    id: exit-criteria
    attributes:
      label: 종료 조건
      description: 작업을 끝내도 되는 조건. 통과해야 하는 기존 테스트와 건드리면 안 되는 범위를 적는다.
  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: 버전, 운영체제, 실행 환경 등.
